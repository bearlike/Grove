# Publish the docs site on every push to main (and `current`, the GitHub
# mirror's release branch), or on demand. The build and upload live in
# _docs-deploy.yml.
#
# This file must NEVER declare `workflow_call`. On this Gitea a workflow file
# that does is not started by a push at all, so the site silently stopped
# deploying the day the two triggers were combined here. screenshots.yml calls
# _docs-deploy.yml directly for the same reason.
name: Docs

on:
  push:
    branches: [main, current]
  workflow_dispatch:

permissions:
  contents: write   # mike pushes the gh-pages branch

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish docs
    uses: ./.github/workflows/_docs-deploy.yml
