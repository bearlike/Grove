name: CI

# The automatic gate for pull requests and for pushes to main. Every job below
# is a SMALL, INDEPENDENT unit that runs as soon as `changes` says its component
# was touched; nothing waits on anything else. The graph used to be one chain
# (quality → tests → integration → webapp gate → e2e), which cost ~73 minutes
# end to end and let one wedged job stall every job behind it.
#
# That chain existed for the runner, not for the code: no gate consumes another
# gate's output. It serialized two real hazards, both fixed at their source now:
#   - setup-uv racing on the SHARED tool-cache volume → every Python job installs
#     uv into its own RUNNER_TOOL_CACHE (.github/actions/setup-python-env).
#   - jobs starving one another's memory on a 2-slot, 2.5 GB runner → the current
#     runner has 8 slots of 4 GB. If a run shows the starvation signature (a
#     uniform timeout across unrelated tests, never an assertion), that is the
#     host: see tests/CLAUDE.md before reading it as a regression.
#
# WHICH COMPONENTS a change touches is data, not YAML: .github/ci/components.json,
# read by .github/ci/affected.py, and tests/test_ci_components.py proves every
# package and every test file has exactly one owner. Add a package → add it there.
#
# The merge gate is `ci-status`, the one check a PR needs. It passes when every
# job either succeeded or was skipped because its component was untouched.
#
# BRANCH PUSHES DO NOT RUN THIS. A pull request runs it once and the merge to
# main runs it once; before, one change ran it three times (branch, PR, main).
# To test a branch with no PR, dispatch this workflow — or any component's own
# reusable unit — against it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      components:
        description: "Components to run, space separated (core daemon tui client mcp tooling docs webapp workflows), or 'all'"
        type: string
        required: false
        default: "all"

# Per ref: a newer commit on the same PR or on main supersedes this run. Other
# workflows (screenshots, docs) have their own groups, so a merge here never
# cancels them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Affected components
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      core: ${{ steps.pick.outputs.core }}
      daemon: ${{ steps.pick.outputs.daemon }}
      tui: ${{ steps.pick.outputs.tui }}
      client: ${{ steps.pick.outputs.client }}
      mcp: ${{ steps.pick.outputs.mcp }}
      tooling: ${{ steps.pick.outputs.tooling }}
      docs: ${{ steps.pick.outputs.docs }}
      webapp: ${{ steps.pick.outputs.webapp }}
      workflows: ${{ steps.pick.outputs.workflows }}
      python: ${{ steps.pick.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit has to be present to diff against.
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          ASKED: ${{ inputs.components }}
        run: |
          set -euo pipefail
          # A dispatch runs exactly what was asked for; it never silently skips.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            names="core daemon tui client mcp tooling docs webapp workflows"
            for n in $names; do
              if [ "$ASKED" = "all" ] || [[ " $ASKED " == *" $n "* ]]; then v=true; else v=false; fi
              echo "$n=$v" >> "$GITHUB_OUTPUT"
            done
          # FAIL OPEN: a first push, a force-push or a squash can leave the base
          # unresolvable, and a diff that errors must run EVERYTHING.
          elif [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base unresolvable; running every component"
            printf '' | python3 .github/ci/affected.py --all >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE" "$HEAD" | tee /dev/stderr \
              | python3 .github/ci/affected.py >> "$GITHUB_OUTPUT"
          fi
          # One flag for "any Python component", which the shared lint job keys on.
          if grep -qE '^(core|daemon|tui|client|mcp|tooling)=true' "$GITHUB_OUTPUT"; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # ── Python ──────────────────────────────────────────────────────────────────
  # One lint job for the whole package: ruff, mypy and import-linter each read
  # every module at once (import contracts are cross-package by definition), so
  # splitting them per component would only repeat the same ~90s of work.
  py-quality:
    name: Python quality
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/_py-quality.yml

  # Test jobs are split by the per-area timings measured on a real run, so no
  # one job dominates: tui 5.0m, core 4.4m, daemon 3.8m, the rest ~1.5m.
  core-tests:
    name: core
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/_py-tests.yml
    with:
      paths: tests/core tests/test_cli_composition.py tests/test_install_scripts.py tests/test_mcp_sdk.py tests/test_offline_guarantee.py tests/test_statusline.py tests/test_systemd_packaging.py tests/test_truststore.py
      ignore: tests/core/agents tests/core/usage tests/core/tickets tests/core/issueops tests/core/contracts
      timeout: 15

  core-subsystems:
    name: core subsystems
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/_py-tests.yml
    with:
      paths: tests/core/agents tests/core/usage tests/core/tickets tests/core/issueops tests/core/contracts
      timeout: 10

  daemon-tests:
    name: daemon
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    uses: ./.github/workflows/_py-tests.yml
    with:
      paths: tests/daemon
      timeout: 12

  tui-tests:
    name: tui + cli
    needs: changes
    if: needs.changes.outputs.tui == 'true'
    uses: ./.github/workflows/_py-tests.yml
    with:
      paths: tests/tui tests/cli
      timeout: 15

  surface-tests:
    name: client + mcp + tooling
    needs: changes
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.mcp == 'true' || needs.changes.outputs.tooling == 'true'
    uses: ./.github/workflows/_py-tests.yml
    with:
      paths: tests/client tests/mcp tests/tools
      timeout: 10

  # Real tmux and real git, selected by MARKER across every directory — so it
  # must run for ANY Python change: an integration test can live under any
  # component's tests, and a component job runs `not integration`. Gating it on
  # a few components left an integration-marked TUI test unrun by a TUI-only
  # change. ~1.5 minutes once the soak test is excluded; that lives in
  # nightly.yml (10 of this job's 11 minutes, and a timing property, not a
  # contract).
  integration:
    name: integration
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/_py-tests.yml
    with:
      paths: tests
      markers: "integration"
      keyword: "not soak"
      timeout: 10

  # ── Webapp ──────────────────────────────────────────────────────────────────
  webapp-checks:
    name: webapp checks
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    uses: ./.github/workflows/_webapp-gate.yml

  # One job PER SHARD. A matrix inside a reusable workflow runs as one job on
  # this Gitea (1.26): the runner executes the shards one after another in a
  # single container, and max-parallel is not enforced server-side before 1.27.
  # Separate jobs are the only form that actually runs in parallel.
  e2e-1:
    name: e2e 1/4
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    uses: ./.github/workflows/_webapp-e2e.yml
    with: { shard: 1, shards: 4 }
  e2e-2:
    name: e2e 2/4
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    uses: ./.github/workflows/_webapp-e2e.yml
    with: { shard: 2, shards: 4 }
  e2e-3:
    name: e2e 3/4
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    uses: ./.github/workflows/_webapp-e2e.yml
    with: { shard: 3, shards: 4 }
  e2e-4:
    name: e2e 4/4
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    uses: ./.github/workflows/_webapp-e2e.yml
    with: { shard: 4, shards: 4 }

  # ── Docs ────────────────────────────────────────────────────────────────────
  docs-build:
    name: docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/_docs-build.yml

  # ── The CI itself ───────────────────────────────────────────────────────────
  workflows-lint:
    name: workflows lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: ./.github/workflows/_workflows-lint.yml

  # ── The one check a PR needs ────────────────────────────────────────────────
  ci-status:
    name: ci-status
    needs:
      - changes
      - py-quality
      - core-tests
      - core-subsystems
      - daemon-tests
      - tui-tests
      - surface-tests
      - integration
      - webapp-checks
      - e2e-1
      - e2e-2
      - e2e-3
      - e2e-4
      - docs-build
      - workflows-lint
    if: ${{ always() }}
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # `skipped` is a pass: its component was untouched. `cancelled` is not —
      # a superseded run must never read as green.
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["RESULTS"]).items()}
          for name, result in sorted(results.items()):
              print(f"{result:>10}  {name}")
          bad = {n: r for n, r in results.items() if r not in ("success", "skipped")}
          if bad:
              sys.exit(f"not green: {bad}")
          PY
