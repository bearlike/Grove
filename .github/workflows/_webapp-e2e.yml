name: Webapp e2e (reusable)

# ONE Playwright shard per call. Callers fan out by calling this once per shard
# as separate jobs (ci.yml does four), because that is the only form that runs
# in parallel here: on this Gitea (1.26) a matrix inside a reusable workflow is
# one job, and the runner executes its legs one after another in one container.
# Measured on run 7912 — four "parallel" shards ran back to back for 36 minutes.
# `max-parallel` is only enforced server-side from Gitea 1.27.
#
# Sharding stays mandatory: the whole suite measures ~30-60 minutes serially and
# the runner kills any job at 1 hour, which would report as a failure rather
# than a timeout. Playwright's `--shard=i/n` splits by spec file.
#
# IF SHARDS FAIL TOGETHER, READ WHICH TESTS BEFORE HOW MANY. On a 2-slot runner
# with 2.5 GB jobs, four concurrent shards starved each other: 38 failed / 3
# passed, every failure a 90s `locator.click` timeout and not one assertion. A
# uniform timeout on every click is a machine that cannot paint. The current
# runner has 8 slots of 4 GB; if that signature returns, run fewer shards at
# once (dispatch them individually) rather than reading it as 49 broken specs.

on:
  workflow_call:
    inputs:
      shard:
        description: "Which shard to run (1-based)"
        type: number
        required: false
        default: 1
      shards:
        description: "Total number of shards the suite is split into"
        type: number
        required: false
        default: 4
      grep:
        description: "Playwright --grep filter; empty runs every spec"
        type: string
        required: false
        default: ""
      ref:
        description: "Ref to check out; empty uses the triggering ref"
        type: string
        required: false
        default: ""

jobs:
  e2e:
    name: playwright ${{ inputs.shard }}/${{ inputs.shards }}
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # A shard measures 8-10 minutes including setup.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: webapp
        run: npm ci
      # `--with-deps` installs the system libraries the browser needs; the
      # bare download is not enough on a clean image.
      - name: Install Playwright browsers
        working-directory: webapp
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: webapp
        env:
          E2E_GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          args=(--shard=${{ inputs.shard }}/${{ inputs.shards }})
          if [ -n "$E2E_GREP" ]; then args+=(--grep "$E2E_GREP"); fi
          npx playwright test "${args[@]}"
      # Traces are retained on failure by playwright.config.ts; without this
      # upload a red shard leaves nothing to debug from.
      #
      # NOT `actions/upload-artifact@v4` — it fails on Gitea with
      # `GHESNotSupportedError: @actions/artifact v2.0.0+ ... are not currently
      # supported on GHES`, and it fails as a ::warning::, so the step stays
      # GREEN and the artifact simply never exists. Measured 2026-09-16: every
      # shard of the first real e2e run logged it and no report was retrievable.
      # A debugging aid that silently produces nothing is worse than none, since
      # you only discover it when you already need the trace.
      #
      # Summarize into the log instead, which is the one sink Gitea always
      # keeps. `|| true` because this runs on failure() and must never mask the
      # test result with an error of its own.
      - name: Summarize failures
        if: failure()
        working-directory: webapp
        run: |
          set -uo pipefail
          echo "── failed specs (shard ${{ inputs.shard }}/${{ inputs.shards }}) ──"
          # The JSON report is not enabled, so read the trace dirs Playwright
          # writes per failing test; each directory name is the spec + title.
          ls -1 test-results 2>/dev/null | head -40 || true
          echo "── error excerpts ──"
          grep -rhoE "(Error|expect)[^\\n]{0,160}" test-results --include="*.txt" 2>/dev/null | sort -u | head -40 || true
