# Grove decor for the tmux running INSIDE a container workspace.
#
# Hand-written, with no plugin manager. A Grove container is firewalled by
# default, so TPM could not fetch anything even if it were installed — and a
# plugin manager would be a runtime dependency on a tree Grove bind-mounts
# read-only. Every line below is plain tmux configuration.
#
# The one job this file must not fail at: an attached human can see, without
# looking for it, that this bar belongs to a dev container and not to the host
# tmux they are also attached to. Hence the badge leading the status-right.
#
# Deliberately NOT set here, because Grove owns them per session and a config
# file would fight that: `remain-on-exit` (set per session so a finished agent
# leaves a readable pane), the prefix key (the human's own muscle memory), and
# anything about session or window lifecycle.

# `screen-256color` over `tmux-256color`: the entry has to exist in whatever
# terminfo database the container ends up with, and Grove's bundled tmux may not
# be the one running (an image shipping its own tmux is preferred when
# configured). `screen-256color` ships in even a minimal ncurses install;
# `tmux-256color` lives in the fuller terminfo packages that minimal images drop,
# and an absent entry costs colour or an outright refusal. Italics are the price.
set -g default-terminal "screen-256color"

# The pane is a viewport a human attaches to, so scroll and select work.
set -g mouse on

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# A calm dark palette, catppuccin-mocha values, so the bar reads as deliberate
# rather than as tmux's default green.
#   base #1e1e2e · surface #313244 · overlay #6c7086
#   text #cdd6f4 · subtext #a6adc8
#   mauve #cba6f7 · peach #fab387 · blue #89b4fa · red #f38ba8
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#cba6f7"

set -g status-left ""
set -g status-left-length 0
set -g status-right-length 120

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#89b4fa,bold] #I:#W "
setw -g window-status-activity-style "fg=#fab387"

# The badge is first, bold, and on its own accent so it cannot be mistaken for a
# host bar. `resources.sh` is invoked as an ARGUMENT to `sh` — never relying on
# an execute bit, which a wheel build or a plain `cp` does not reliably preserve
# and whose loss would leave a segment silently empty forever.
set -g status-right "#[bg=#cba6f7,fg=#1e1e2e,bold] ⬢ CONTAINER #[bg=#1e1e2e,fg=#a6adc8] #(sh /grove/decor/resources.sh) #[fg=#6c7086]│#[fg=#cba6f7] #S #[fg=#6c7086]│#[fg=#a6adc8] %H:%M "
